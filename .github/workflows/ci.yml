# Untrusted PR pipeline (plan §19): no certificates, no secrets, no signing.
# Third-party actions are pinned to full commit SHAs (plan §19 supply chain).
name: CI
# Day-to-day commits are checked locally (Scripts/check.sh) before they land on main; GitHub only sees
# main when it is published, so this runs once per publish, plus for outside pull requests.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', '.gitignore']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 45
    # Liquid Glass code needs the macOS 26 SDK; macos-15 images default to Xcode 16.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
      # Watchdog: a run with no test starting or ending for two minutes (or past 15 minutes) is stopped;
      # hung or failing tests and stuck stacks are written as check annotations, readable without signing
      # in (job logs are not).
      - name: Package tests
        run: Scripts/ci-test.sh
        env:
          # Build plus tests take about four minutes here.
          RUYIO_TEST_LIMIT: 900
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build app (ad-hoc, arm64)
        run: xcodebuild -project Ruyio.xcodeproj -scheme Ruyio -configuration Release -derivedDataPath build/DerivedData build
