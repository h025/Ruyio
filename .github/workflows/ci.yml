# Untrusted PR pipeline (plan §19): no certificates, no secrets, no signing.
# Before publishing, pin third-party actions to full commit SHAs (plan §19 supply chain).
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package tests
        run: swift test --package-path Packages/RuyioKit
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build app (ad-hoc, arm64)
        run: xcodebuild -project Ruyio.xcodeproj -scheme Ruyio -configuration Release -derivedDataPath build/DerivedData build
