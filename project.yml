name: Ruyio
options:
  bundleIdPrefix: app.ruyio
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  RuyioKit:
    path: Packages/RuyioKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    RUYIO_APP_GROUP: group.app.ruyio.shared
    RUYIO_OFFICIAL_PUBLISHER: ""
    RUYIO_UPDATE_FEED: ""
    RUYIO_UPDATE_PUBLIC_KEY: ""
    RUYIO_FINDER_CHANNEL: home
    DEAD_CODE_STRIPPING: YES
targets:
  Ruyio:
    type: application
    platform: macOS
    sources:
      - path: Apps/Ruyio
        excludes: ["Resources/**"]
      - path: Apps/Ruyio/Resources
        buildPhase: resources
    dependencies:
      - package: RuyioKit
        product: RuyioHostKit
      - package: RuyioKit
        product: RuyioUI
      - package: RuyioKit
        product: RuyioPersistence
      - package: RuyioKit
        product: RuyioProtocol
      - package: RuyioKit
        product: RuyioCore
      - package: RuyioKit
        product: RuyioSourceTransport
      - target: RuyioFinderSync
        embed: true
        codeSign: true
      - target: RuyioMediaDecoder
        embed: true
        codeSign: true
      - target: RuyioCaptureHelper
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: ClipboardHistory
        embed: false
        link: false
      - target: FinderEssentials
        embed: false
        link: false
    info:
      path: Apps/Ruyio/Info.plist
      properties:
        CFBundleDisplayName: Ruyio
        CFBundleIconFile: Ruyio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Ruyio · MIT License"
        RuyioAppGroup: $(RUYIO_APP_GROUP)
        RuyioFinderChannel: $(RUYIO_FINDER_CHANNEL)
        # Publisher ID of official builds (`cert:<SHA-256>` of the release certificate), set by Scripts/release.sh.
        RuyioOfficialPublisher: $(RUYIO_OFFICIAL_PUBLISHER)
        # Ruyio's own updates (A41): Sparkle-format appcast and EdDSA key, set by Scripts/release.sh only.
        SUFeedURL: $(RUYIO_UPDATE_FEED)
        SUPublicEDKey: $(RUYIO_UPDATE_PUBLIC_KEY)
        NSAppleEventsUsageDescription: Ruyio asks Finder to place files you create from a right-click on the Desktop where you clicked.
    entitlements:
      path: Apps/Ruyio/Ruyio.entitlements
      properties:
        # Only Finder is ever addressed: placing new Desktop files (A38).
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ruyio.mac
        PRODUCT_NAME: Ruyio
      configs:
        # Xcode adds get-task-allow (debugger attach) to ad-hoc builds; installed builds must not have it.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    postBuildScripts:
      - name: Package default plugins
        script: '"${SRCROOT}/Scripts/package-default-plugins.sh"'
        basedOnDependencyAnalysis: false
  RuyioFinderSync:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/FinderSync
    dependencies:
      - package: RuyioKit
        product: RuyioProtocol
    info:
      path: Extensions/FinderSync/Info.plist
      properties:
        CFBundleDisplayName: Ruyio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RuyioAppGroup: $(RUYIO_APP_GROUP)
        RuyioFinderChannel: $(RUYIO_FINDER_CHANNEL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    entitlements:
      path: Extensions/FinderSync/FinderSync.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /Library/Application Support/Ruyio/FinderBridge/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ruyio.mac.FinderSync
        PRODUCT_NAME: RuyioFinderSync
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  RuyioMediaDecoder:
    type: xpc-service
    platform: macOS
    sources:
      - path: Services/MediaDecoder
    info:
      path: Services/MediaDecoder/Info.plist
      properties:
        CFBundleDisplayName: RuyioMediaDecoder
        XPCService:
          ServiceType: Application
    entitlements:
      path: Services/MediaDecoder/MediaDecoder.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ruyio.mac.MediaDecoder
        PRODUCT_NAME: RuyioMediaDecoder
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  RuyioCaptureHelper:
    # Holds Screen Recording on its own: launched through LaunchServices, so the host that spawns plugins
    # never does (PRD §3.5).
    type: application
    platform: macOS
    sources:
      - path: Helpers/CaptureHelper
    info:
      path: Helpers/CaptureHelper/Info.plist
      properties:
        CFBundleDisplayName: Ruyio Capture Helper
        CFBundleName: Ruyio Capture Helper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ruyio.mac.CaptureHelper
        PRODUCT_NAME: RuyioCaptureHelper
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        SKIP_INSTALL: YES
  ClipboardHistory:
    type: application
    platform: macOS
    sources:
      - path: Plugins/ClipboardHistory/main.swift
      - path: Plugins/ClipboardHistory/manifest.json
        buildPhase: resources
    dependencies:
      - package: RuyioKit
        product: ClipboardHistoryKit
      - package: RuyioKit
        product: RuyioPluginSDK
    info:
      path: Plugins/ClipboardHistory/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
    entitlements:
      path: Plugins/ClipboardHistory/ClipboardHistory.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ruyio.plugin.clipboard-history
        PRODUCT_NAME: ClipboardHistory
        SKIP_INSTALL: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  FinderEssentials:
    type: application
    platform: macOS
    sources:
      - path: Plugins/FinderEssentials/main.swift
      - path: Plugins/FinderEssentials/manifest.json
        buildPhase: resources
    dependencies:
      - package: RuyioKit
        product: FinderEssentialsKit
      - package: RuyioKit
        product: RuyioPluginSDK
    info:
      path: Plugins/FinderEssentials/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
    entitlements:
      path: Plugins/FinderEssentials/FinderEssentials.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ruyio.plugin.finder-essentials
        PRODUCT_NAME: FinderEssentials
        SKIP_INSTALL: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
schemes:
  Ruyio:
    build:
      targets:
        Ruyio: all
    run:
      config: Debug
